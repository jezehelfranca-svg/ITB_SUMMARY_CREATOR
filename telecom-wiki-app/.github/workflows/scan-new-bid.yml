name: Scan New Project Bid

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Friendly name of the project bid'
        required: true
        default: 'New Urea Expansion Project'
      pdf_folder_name:
        description: 'Subfolder in repository containing PDFs (e.g. input_pdfs)'
        required: true
        default: 'input_pdfs'
  push:
    paths:
      - 'input_pdfs/**.pdf'

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF Flask

    - name: Create Input PDFs Directory if missing
      run: mkdir -p input_pdfs

    - name: Run Extraction Scanner
      run: |
        # If triggered manually, use the inputs. If triggered by push, scan the input_pdfs folder
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          python scan_project.py --name "${{ github.event.inputs.project_name }}" --dir "${{ github.event.inputs.pdf_folder_name }}"
        else
          python scan_project.py --name "Automated Scan Bid" --dir "input_pdfs"
        fi

    - name: Commit Scanned Requirements
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add projects/ static/
        if git diff --staged --quiet; then
          echo "No changes in requirements database detected."
        else
          git commit -m "auto-scanned: ingest new project telecom specs"
          git push
        fi
